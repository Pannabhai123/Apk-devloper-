name: Verify cloud and publish APK

on:
  push:
    paths:
      - .github/workflows/verify-cloud-publish-apk.yml

permissions:
  contents: write

jobs:
  verify-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified files
        uses: actions/checkout@v4

      - name: Test real cloud PDF to PPTX workflow
        run: python backend/scripts/verify_remote.py https://dream-classes-ppt-api.onrender.com

      - name: Audit APK cloud configuration
        run: |
          python - <<'PY'
          import hashlib
          import zipfile
          path = 'releases/Dream_Classes_PPT_Maker.apk'
          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()
              assert 'classes.dex' in names
              assert 'assets/public/index.html' in names
              scripts = ''.join(archive.read(name).decode('utf-8', 'ignore')
                                for name in names if name.endswith('.js'))
              assert 'https://dream-classes-ppt-api.onrender.com/api' in scripts
          digest = hashlib.sha256(open(path, 'rb').read()).hexdigest()
          assert digest == '24d9aa9cade983cb86f9af6d9c91877984a03e36059dc6234a1c04f126742ba7'
          print('APK cloud URL, assets, DEX, and SHA-256 verified:', digest)
          PY

      - name: Upload and independently download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.1.1 releases/Dream_Classes_PPT_Maker.apk releases/INSTALL.txt --repo "${{ github.repository }}" --clobber
          mkdir -p /tmp/dream-release-check
          gh release download v1.1.1 --pattern Dream_Classes_PPT_Maker.apk --dir /tmp/dream-release-check --repo "${{ github.repository }}" --clobber
          cmp releases/Dream_Classes_PPT_Maker.apk /tmp/dream-release-check/Dream_Classes_PPT_Maker.apk
          sha256sum /tmp/dream-release-check/Dream_Classes_PPT_Maker.apk
