name: RONNY Android checks
on:
  push:
    branches: [arena/be57a5a2-apk-devloper]
    paths-ignore: [README.md]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 34]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run core unit checks
        run: ./scripts/test-core.sh
      - name: Build Android app and instrumentation APK
        run: ./gradlew --no-daemon assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Verify release signing with a disposable CI key
        run: |
          export RONNY_KEYSTORE_PATH="$RUNNER_TEMP/ronny-ci.p12"
          export RONNY_KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          export RONNY_KEY_ALIAS="ronny-ci-only"
          export RONNY_KEY_PASSWORD="$RONNY_KEYSTORE_PASSWORD"
          trap 'rm -f "$RONNY_KEYSTORE_PATH"' EXIT
          keytool -genkeypair -keystore "$RONNY_KEYSTORE_PATH" -storetype PKCS12             -storepass "$RONNY_KEYSTORE_PASSWORD" -keypass "$RONNY_KEY_PASSWORD"             -alias "$RONNY_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1             -dname 'CN=Disposable CI Verification Key' -noprompt
          ./gradlew --no-daemon assembleRelease --rerun-tasks
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Enable hardware acceleration for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and smoke-test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest > /tmp/ronny-device.log 2>&1
      - name: Summarize device tests
        if: always()
        run: |
          python3 - <<'PYEOF'
          import glob, xml.etree.ElementTree as ET
          tests = failures = skipped = 0
          for path in glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True):
              try:
                  root = ET.parse(path).getroot()
                  cases = list(root.iter('testcase'))
                  tests += len(cases)
                  failures += sum(bool(c.findall('failure') or c.findall('error')) for c in cases)
                  skipped += sum(bool(c.findall('skipped')) for c in cases)
              except ET.ParseError:
                  pass
          print(f'::notice title=Android test summary::{tests} cases, {failures} failures, {skipped} skipped (API ${{ matrix.api }})')
          PYEOF
      - name: Annotate failing device tests
        if: failure()
        run: |
          python3 - <<'PYEOF'
          import glob, os, xml.etree.ElementTree as ET
          failures = []
          for path in glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True):
              try:
                  for test in ET.parse(path).getroot().iter('testcase'):
                      for failure in test.findall('failure') + test.findall('error'):
                          failures.append(test.get('classname', '') + '.' + test.get('name', '') + ': ' + (failure.get('message') or failure.text or 'unknown'))
              except ET.ParseError:
                  pass
          if not failures and os.path.exists('/tmp/ronny-device.log'):
              failures.append(open('/tmp/ronny-device.log', errors='replace').read()[-6000:])
          for message in failures:
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Android test failure::' + message[:12000])
          PYEOF
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronny-test-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
