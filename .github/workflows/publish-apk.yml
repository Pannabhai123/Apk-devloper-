name: Publish verified APK

on:
  push:
    paths:
      - .github/workflows/publish-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release files
        uses: actions/checkout@v4

      - name: Upload APK and installation notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload v1.1.0
          releases/Dream_Classes_PPT_Maker.apk
          releases/INSTALL.txt
          --repo "${{ github.repository }}"
          --clobber
