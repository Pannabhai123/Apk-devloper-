# Render manifest for VidyaPariksha.
#
# One free web service runs the whole application: the built SPA, the Express
# API and the SQLite database. The database file and uploaded images live on a
# persistent disk mounted at /app/data, so questions, attempts, users and results
# survive redeploys and restarts.
#
# Deploy from GitHub: in the Render dashboard choose "New > New Web Service >
# Connect GitHub", pick Pannabhai123/Apk-devloper-, pick the branch, and Render
# reads this file. SESSION_SECRET and ADMIN_BOOTSTRAP_SECRET are generated for
# you — read ADMIN_BOOTSTRAP_SECRET from the service's Environment tab, because
# the one-time administrator setup form on the live site asks for it.
#
# NOTE: free-tier limits (RAM, CPU, spin-down behaviour, disk size) change over
# time and could not be verified from the build environment. Check
# https://render.com/docs/free and https://render.com/pricing before relying on
# them. This file targets the free plan; raise `plan`/`disk` if you outgrow it.

services:
  - type: web
    name: vidyapariksha
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    # /api/health must stay cheap: it performs no writes and creates no session.
    disk:
      name: vidyapariksha-data
      mountPath: /app/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '4000'
      # Generated by Render. Rotating it invalidates every existing session.
      - key: SESSION_SECRET
        generateValue: true
      # Behind Render's TLS terminator, so cookies must be marked Secure.
      - key: COOKIE_SECURE
        value: 'true'
      - key: TRUST_PROXY
        value: 'true'
      # Random value generated by Render. This is the ONLY way to open the
      # one-time first-administrator form on the live site. Read it from the
      # service's Environment tab, then delete it once you have created the
      # administrator (the form refuses to run afterwards anyway).
      - key: ADMIN_BOOTSTRAP_SECRET
        generateValue: true
      # Populate the demo question bank the first time the database is empty.
      # seedDemoContent() is idempotent and only runs when the table is empty,
      # so it can never duplicate or overwrite your own content.
      - key: SEED_DEMO_ON_EMPTY
        value: 'true'
      # Public exams for visitors without an account. Turn off to require sign-in.
      - key: GUEST_TESTS_ENABLED
        value: 'true'
      - key: ALLOW_REGISTRATION
        value: 'true'
      - key: MAINTENANCE_MODE
        value: 'false'
      # Password recovery stays disabled (honest 503) until a real provider is
      # configured. See README §10 for SMTP / Resend values.
      - key: MAIL_PROVIDER
        value: none
      # PUBLIC_ORIGIN is deliberately NOT set: the app derives the public HTTPS
      # origin from each request, which is what you want on a *.onrender.com
      # subdomain assigned after deploy.
